name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  stdlib-arcpy-edition:
    # proves slotmap_arcpy needs nothing beyond the standard library (ArcPy is stubbed by tests_arcpy/fake_arcpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.8"}
      - run: python -m unittest discover -s tests_arcpy -v
